name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only: CI checks code and needs to change nothing on the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # The README's minimum, so nothing newer slips in unnoticed.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # export_pdf() turns the engraved pages into a PDF with rsvg-convert.
      - name: Install rsvg-convert
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librsvg2-bin

      # Everything in requirements.txt but the recognition stack: torch (gigabytes with CUDA from
      # PyPI), and homr and rapidocr, which only pipeline.recognize imports, inside its functions.
      - name: Install dependencies
        run: |
          grep -vE '^(torch|homr|rapidocr)\b' requirements.txt > "$RUNNER_TEMP/requirements.txt"
          pip install -r "$RUNNER_TEMP/requirements.txt"

      # The readers are files of a release, not of git. The app reads only their .onnx, and so does
      # test_reading; the .pt are for training and test_exported, which needs torch.
      - name: Fetch the readers
        run: python tools/fetch_models.py --onnx

      # Left out: the tests that import torch, directly or through pipeline.recognize.
      # test_chord_images also needs the fonts `python -m chords.fonts` downloads. Two tests in
      # test_server borrow test_corrections' sheets, and skip themselves without torch.
      - name: Tests
        run: >-
          python -m pytest tests
          --ignore=tests/test_chord_images.py
          --ignore=tests/test_corrections.py
          --ignore=tests/test_exported.py
          --ignore=tests/test_notes.py
          --ignore=tests/test_repair.py

  # The editor's browser checks, tests/e2e_editor.py, against a server started as the README says.
  # The suite starts stand-in servers with .venv/bin/python, so the packages go in a .venv here.
  # Reading a real sheet needs RapidOCR and homr, which this job leaves out, so --no-reading
  # skips the few checks that do.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install rsvg-convert
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librsvg2-bin

      - name: Install dependencies
        run: |
          python -m venv .venv
          grep -vE '^(torch|homr|rapidocr)\b' requirements.txt > "$RUNNER_TEMP/requirements.txt"
          .venv/bin/pip install -r "$RUNNER_TEMP/requirements.txt" playwright==1.65.2
          .venv/bin/python -m playwright install --with-deps chromium

      - name: Browser checks
        run: |
          .venv/bin/python -m app.server --notes own --port 8011 --jobs "$RUNNER_TEMP/jobs" > "$RUNNER_TEMP/server.log" 2>&1 &
          for _ in $(seq 100); do curl -sf http://127.0.0.1:8011/api/scores > /dev/null && break; sleep 0.3; done
          .venv/bin/python tests/e2e_editor.py --port 8011 --no-reading

      - name: The server's log
        if: failure()
        run: cat "$RUNNER_TEMP/server.log"

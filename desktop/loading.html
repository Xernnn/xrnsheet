<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>xrnsheet</title>
<style>
  /* The app's own colours, from app/static/app.css. */
  :root { --bg: #f5f5f6; --text: #1f1f1f; --muted: #5d6066; --field: #ffffff; --line: #d3d6db; --accent: #70afea; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #2d2d30; --text: #ececee; --muted: #a2a4aa; --field: #242427; --line: #47474b; --accent: #2093fe; color-scheme: dark; }
  }
  html, body { height: 100%; margin: 0; }
  /* MiSans, the font of every xrn app, as installed: this page shows before the server that serves the app's copy. */
  body { display: grid; place-items: center; padding: 16px; box-sizing: border-box; background: var(--bg); color: var(--text); font: 15px/1.5 "MiSans Latin VF", "MiSans Latin", "MiSans", system-ui, sans-serif; }
  .tile { display: block; width: 56px; height: 56px; margin: 0 auto 20px; }
  main { max-width: 760px; width: 100%; text-align: center; }
  .spinner { width: 28px; height: 28px; margin: 0 auto 16px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: turn 0.9s linear infinite; }
  @keyframes turn { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }
  h1 { font-size: 17px; font-weight: 600; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0; }
  pre { text-align: left; white-space: pre-wrap; word-break: break-word; max-height: 50vh; overflow: auto; margin: 16px 0 0; padding: 12px; background: var(--field); border: 1px solid var(--line); border-radius: 6px; font: 12px/1.45 ui-monospace, monospace; color: var(--text); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <svg class="tile" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="xrnsheet"><clipPath id="xrnsheet-tile"><rect width="100" height="100" rx="24"/></clipPath><g clip-path="url(#xrnsheet-tile)"><rect width="100" height="100" fill="#005CA3"/><path transform="translate(50 50) scale(0.6) translate(-110 -118)" d="M-40,174 L55,72 C68,58 85,47 98,50 C110,53 112,72 113,95 C114,125 115,150 118,165 C121,182 135,190 150,186 C158,184 163,178 166,170 M-60,301.3 L260,-64.9" fill="none" stroke="#18181B" stroke-width="28.33" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(-2.5 -2.5) scale(1.05)"><path d="M21.75,73.28 A12.5,9.5 -20 1 1 45.25,64.72 A12.5,9.5 -20 1 1 21.75,73.28 Z M53.75,66.28 A12.5,9.5 -20 1 1 77.25,57.72 A12.5,9.5 -20 1 1 53.75,66.28 Z M38.69,29.3 L77.69,20 L77.69,60.3 L70.69,60.3 L70.69,34.3 L45.69,41 L45.69,67.3 L38.69,67.3 Z" fill="#FFFFFF"/></g></svg>
  <div class="spinner" id="spinner"></div>
  <h1 id="title">Starting…</h1>
  <p id="note" hidden></p>
  <pre id="detail" hidden></pre>
</main>
<script>
  const query = new URLSearchParams(location.search);
  const problem = query.get("problem");
  if (problem) {
    document.getElementById("spinner").hidden = true;
    document.getElementById("title").textContent = problem;
    document.getElementById("note").textContent = "Close this window and open xrnsheet again once it's fixed.";
    document.getElementById("note").hidden = false;
    const detail = query.get("detail");
    if (detail) {
      const box = document.getElementById("detail");
      box.textContent = detail;
      box.hidden = false;
    }
  } else if (query.get("state") === "restarting") {
    document.getElementById("title").textContent = "Starting again…";
  }
</script>
</body>
</html>
